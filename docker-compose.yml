services:
  mongodb:
    # mongo:4.4 — CPU mesin ini (Intel Celeron N4020) tidak mendukung AVX,
    # sedangkan MongoDB 5.0+ wajib AVX. Driver mongodb@7 tetap kompatibel dgn 4.4.
    # Mode replica set (single node) agar transaksi yang dipakai Better Auth aktif.
    image: mongo:4.4
    container_name: bro-barber-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - bro_barber_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  bro_barber_mongo_data:
