services:
  mongodb:
    image: mongo:7
    container_name: bro-barber-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - bro_barber_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bro_barber_mongo_data:
